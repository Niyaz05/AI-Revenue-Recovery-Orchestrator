version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rzp_recovery_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: recovery_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rzp_recovery_backend
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/recovery_db
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  pgdata:
